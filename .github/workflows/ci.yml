name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  dbt-validate:
    name: Validate dbt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt Databricks adapter
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-databricks==1.12.5"

      - name: Parse dbt project
        working-directory: dbt/retail_lakehouse
        run: |
          dbt parse \
            --no-partial-parse \
            --profiles-dir ../../.github/dbt

  python-check:
    name: Validate Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Airflow DAGs
        run: |
          python -m compileall airflow/dags